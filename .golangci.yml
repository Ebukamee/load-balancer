version: "2"

linters:
  enable:
    - bodyclose     # forgot to close an http.Response body (leaks connections)
    - errorlint     # wrong error comparisons (use errors.Is / errors.As)
    - gosec         # common security mistakes
    - misspell
    - revive        # style, a successor to golint
    - unconvert
  exclusions:
    # Allows well-known safe patterns such as `defer resp.Body.Close()`.
    presets:
      - std-error-handling
    rules:
      # Test backends echo request data on purpose so tests can inspect it;
      # that is not a real XSS risk, so skip security checks in tests only.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
